name: Pulse Release Plan

on:

  workflow_dispatch:

    inputs:

      target:

        description: "Release target"

        required: true

        type: choice

        options:

          - staging

          - production

      image_tag:

        description: "Docker image tag"

        required: true

        default: "latest"

        type: string

permissions:

  contents: read

  packages: read

jobs:

  release-plan:

    runs-on: ubuntu-24.04

    steps:

      - name: Validate inputs and demo secret

        env:

          TARGET: ${{ inputs.target }}

          TAG: ${{ inputs.image_tag }}

          DEMO_TOKEN: ${{ secrets.DEMO_RELEASE_TOKEN }}

        run: |

          set -e

          test "$TARGET" = "staging" || test "$TARGET" = "production"

          test -n "$TAG"

          test -n "$DEMO_TOKEN"

          echo "Release inputs validated"

      - name: Pull selected image

        env:

          GH_TOKEN: ${{ github.token }}

          IMAGE: ghcr.io/${{ github.repository }}

          TAG: ${{ inputs.image_tag }}

        run: |

          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          docker pull "${IMAGE,,}:$TAG"

      - name: Build release evidence

        env:

          TARGET: ${{ inputs.target }}

          TAG: ${{ inputs.image_tag }}

          SHA: ${{ github.sha }}

        run: |

          echo "Target: $TARGET" > release-evidence.txt

          echo "Image tag: $TAG" >> release-evidence.txt

          echo "Commit SHA: $SHA" >> release-evidence.txt

          echo "Validation: passed" >> release-evidence.txt

      - name: Upload release evidence

        uses: actions/upload-artifact@v4

        with:

          name: release-evidence

          path: release-evidence.txt
 
